spring:
  application:
    name: binance-futures-level-breakout-bot
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: 443
  shutdown: graceful
  ssl:
    enabled: true
    key-store: "file:${TLS_KEYSTORE_PATH}"
    key-store-password: "${TLS_KEYSTORE_PASSWORD}"
    key-store-type: PKCS12

bot:
  binance:
    startup-enabled: true
  evidence:
    directory: "${BOT_EVIDENCE_DIRECTORY:build/evidence}"
    recent-audit-limit: 200
    recent-trade-limit: 200
    raw-event-limit: 100000
    shutdown-flush-timeout: 2s
  execution:
    request-timeout: 1s
    reconciliation-interval: 1s
    stop-confirmation-timeout: 2s
    take-profit-setup-timeout: 3s
    normal-exit-wait: 500ms
  risk:
    monitor-interval: 1s
  failure:
    monitor-interval: 50ms
    reconciliation-interval: 1s
    public-outage-timeout: 3s
    private-outage-timeout: 5s
    recovery-health-duration: 30s
  security:
    username: "${BOT_BASIC_USERNAME}"
    password: "${BOT_BASIC_PASSWORD}"
